<!--
  Shared email header fragment — dark navy → green gradient, CSS-only
  monogram badge (no <img>, so it never breaks when a client blocks remote
  images), title + subtitle slots. Mirrors BrandedEmailLayout's palette so
  every email in the product (Thymeleaf-rendered or legacy Java-built)
  shares one visual identity.

  Usage: th:replace="~{email/fragments/header :: header(title=${title}, subtitle=${subtitle})}"
-->
<div th:fragment="header(title, subtitle)"
     style="padding:28px 32px;background:linear-gradient(135deg,#071827 0%,#0f766e 100%);color:#ffffff;">
  <table role="presentation" cellpadding="0" cellspacing="0">
    <tr>
      <td style="width:44px;height:44px;background:#10b981;border-radius:12px;text-align:center;
                 vertical-align:middle;font-weight:800;font-size:17px;color:#071827;"
          role="img" aria-label="Innovacar logo">IC</td>
      <td style="padding-left:12px;">
        <div style="font-size:12px;letter-spacing:0.1em;text-transform:uppercase;opacity:0.80;">Innovacar</div>
        <div style="font-size:15px;font-weight:700;">Car rental management platform</div>
      </td>
    </tr>
  </table>
  <h1 style="margin:20px 0 0;font-size:24px;line-height:1.3;font-weight:800;" th:text="${title}">Welcome to Innovacar</h1>
  <p th:if="${subtitle}" style="margin:10px 0 0;font-size:14px;line-height:1.7;color:#d7fffb;" th:text="${subtitle}">
    Manage your fleet, reservations, contracts, payments and GPS in one platform.
  </p>
</div>
