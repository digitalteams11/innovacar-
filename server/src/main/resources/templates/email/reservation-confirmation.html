<!DOCTYPE html>
<!--
  Variables: clientName, vehicleName, startDate, endDate, reservationNumber, agencyName
-->
<html th:replace="~{email/fragments/layout :: page(title=${'Reservation confirmed'}, subtitle=${'Your vehicle is booked and ready.'}, content=~{::div.email-content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div class="email-content">
  <p style="margin:0 0 16px;font-size:15px;line-height:1.7;">Hello <strong th:text="${clientName}">there</strong>,</p>
  <p style="margin:0 0 16px;font-size:15px;line-height:1.7;">
    Your reservation with <strong th:text="${agencyName}">your agency</strong> has been confirmed.
  </p>

  <div style="background:#f0fdf9;border:1px solid #d1fae5;border-radius:12px;padding:16px 20px;margin:0 0 20px;">
    <p style="margin:2px 0;font-size:14px;">Vehicle: <strong th:text="${vehicleName}">—</strong></p>
    <p style="margin:2px 0;font-size:14px;">Pick-up: <strong th:text="${startDate}">—</strong></p>
    <p style="margin:2px 0;font-size:14px;">Return: <strong th:text="${endDate}">—</strong></p>
    <p th:if="${reservationNumber}" style="margin:2px 0;font-size:14px;">Reservation #: <strong th:text="${reservationNumber}">—</strong></p>
  </div>
</div>
</body>
</html>
